<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable – Evanoloca</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#060e1e 0%,#0d1f40 50%,#060e1e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:24px;padding:56px 48px;max-width:500px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:#0a1628;margin-bottom:32px}
.logo em{color:#c9a84c;font-style:normal}
.code{font-family:'Playfair Display',serif;font-size:96px;font-weight:900;color:#eeeef2;line-height:1;margin-bottom:8px}
.title{font-size:24px;font-weight:700;color:#0a1628;margin-bottom:12px;font-family:'Playfair Display',serif}
.subtitle{font-size:15px;color:#525d70;line-height:1.7;margin-bottom:36px}
.btn{display:inline-block;padding:14px 36px;border-radius:100px;background:linear-gradient(135deg,#1a3a6b,#0a1628);color:#fff;font-size:15px;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 24px rgba(10,22,40,.25);margin:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(10,22,40,.35)}
.btn-ghost{background:transparent;border:1.5px solid #d8d8e0;color:#525d70;box-shadow:none}
.btn-ghost:hover{background:#f7f8fa;transform:none;box-shadow:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Evan<em>oloca</em></div>
  <div class="code">404</div>
  <h1 class="title">Page introuvable</h1>
  <p class="subtitle">La page que vous recherchez n'existe pas ou a été déplacée. Retournez à l'accueil pour réserver votre véhicule.</p>
  <div>
    <a href="/" class="btn">Retour à l'accueil</a>
    <a href="/#flotte" class="btn btn-ghost">Voir la flotte</a>
  </div>
</div>
</body>
</html>
