<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement annulé – Evanoloca</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#060e1e 0%,#0d1f40 50%,#060e1e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:24px;padding:52px 48px;max-width:460px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.icon{font-size:64px;margin-bottom:20px}
.logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#0a1628;margin-bottom:24px}
.logo em{color:#c9a84c;font-style:normal}
.title{font-size:26px;font-weight:700;color:#0a1628;margin-bottom:12px;font-family:'Playfair Display',serif}
.subtitle{font-size:15px;color:#525d70;line-height:1.7;margin-bottom:36px}
.note{background:#fff8e8;border:1px solid rgba(201,168,76,.25);border-radius:12px;padding:16px 20px;font-size:14px;color:#92680d;margin-bottom:36px;line-height:1.6}
.btn{display:inline-block;padding:14px 36px;border-radius:100px;background:linear-gradient(135deg,#1a3a6b,#0a1628);color:#fff;font-size:15px;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 24px rgba(10,22,40,.25)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(10,22,40,.35)}
.btn-ghost{display:inline-block;padding:14px 36px;border-radius:100px;border:1.5px solid #d8d8e0;color:#525d70;font-size:15px;font-weight:600;text-decoration:none;margin-left:12px;transition:all .2s}
.btn-ghost:hover{background:#f7f8fa;border-color:#9098a8}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Evan<em>oloca</em></div>
  <div class="icon">↩️</div>
  <h1 class="title">Paiement annulé</h1>
  <p class="subtitle">Votre paiement n'a pas été effectué. Aucun montant n'a été débité de votre compte.</p>
  <div class="note">💡 Vous pouvez retourner sur le site et relancer une réservation à tout moment. Votre sélection de véhicule sera toujours disponible.</div>
  <div>
    <a href="/" class="btn">Retour à l'accueil</a>
  </div>
</div>
</body>
</html>
